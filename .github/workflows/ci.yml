name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Start the server
        run: npm start &
        env:
          PORT: '3111'
          CAREPATH_PUBLIC_ORIGIN: http://127.0.0.1:3111
          # The sweep makes ~250 assist calls from one address. Rate limiting
          # itself is covered by the unit tests; raise it here so the smoke
          # test isn't mostly sleeping.
          CAREPATH_RATE_LIMIT_CREATE: '10000'
          CAREPATH_RATE_LIMIT_LOOKUP: '10000'
          CAREPATH_RATE_LIMIT_ASSIST_CLIENT: '10000'
          CAREPATH_RATE_LIMIT_ASSIST_PASS: '10000'

      - name: Wait for the server
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3111/ >/dev/null && exit 0
            sleep 1
          done
          echo "server did not start" >&2
          exit 1

      # Unit tests can pass while the wired-up app is broken — this has already
      # happened once, so the real HTTP path is exercised here too.
      - name: Every route creates, renders, and recovers
        run: node scripts/smoke.mjs
        env:
          CAREPATH_URL: http://127.0.0.1:3111
